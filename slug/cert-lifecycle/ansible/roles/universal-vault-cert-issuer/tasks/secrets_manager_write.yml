---
- name: Get current AWS caller identity
  amazon.aws.aws_caller_info:
    region: "{{ aws_region }}"
  register: caller_identity

- name: Validate AWS account matches expected account_id
  ansible.builtin.fail:
    msg: >-
      AWS account mismatch: current account {{ caller_identity.account }}
      does not match expected account_id {{ account_id }} for app {{ app_name }}.
      Ensure Jenkins assumed the correct spoke account role before invoking this role.
  when: caller_identity.account != account_id

- name: Assemble certificate secret payload
  ansible.builtin.set_fact:
    cert_secret_payload:
      certificate: "{{ issued_certificate }}"
      private_key: "{{ issued_private_key }}"
      ca_chain: "{{ issued_ca_chain }}"
      full_chain: "{{ issued_full_chain }}"
      expiry_epoch: "{{ issued_expiry_epoch }}"
      common_name: "{{ common_name }}"
  no_log: true

- name: Write certificate to Secrets Manager (create or update)
  amazon.aws.aws_secret:
    name: "{{ secret_name }}"
    state: present
    secret_type: string
    secret: "{{ cert_secret_payload | to_json }}"
    region: "{{ aws_region }}"
    tags:
      managed-by: cert-lifecycle
      app_name: "{{ app_name }}"
    purge_tags: false
  no_log: true

- name: Log successful secret write
  ansible.builtin.debug:
    msg: >-
      Certificate written to {{ secret_name }} for app {{ app_name }}
      in account {{ account_name }} ({{ account_id }}).
